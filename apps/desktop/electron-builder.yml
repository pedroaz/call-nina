appId: dev.callnina.app
productName: Call Nina
artifactName: Call-Nina-${version}-${arch}.${ext}
icon: assets/call-nina.png
npmRebuild: false
electronLanguages:
  - de
  - en-US
  - es
  - pt-BR
electronFuses:
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: true
toolsets:
  appimage: 1.0.3
directories:
  output: ../../release/appimage
files:
  - package.json
  - dist/main/index.js
  - dist/main/nina-environment.json
  - dist/preload/index.cjs
  - dist/renderer/**
extraResources:
  - from: ../../docs/offline-artifact-notices.md
    to: notices/offline-artifact-notices.md
  - from: ../../docs/offline-model-license.txt
    to: notices/offline-model-license.txt
  - from: ../../docs/offline-runtime-license.txt
    to: notices/offline-runtime-license.txt
  - from: assets/call-nina.png
    to: call-nina.png
  - from: ../../LICENSE
    to: notices/LICENSE
  - from: ../../content/curriculum
    to: curriculum
    filter:
      - "**/*"
  - from: ../../plugins/call-nina
    to: plugin
    filter:
      - .codex-plugin/**
      - .mcp.json
      - bin/**
      - skills/**
      - prompts/**
  - from: ../../release/mcp-helper
    to: mcp-helper
    filter:
      - "**/*"
  - from: ../../docs/third-party-notices.md
    to: notices/THIRD-PARTY-NOTICES.md
  - from: ../../docs/licensing.md
    to: notices/CALL-NINA-LICENSING.md
  - from: ../../packages/design-system/assets/fonts
    to: notices/fonts
    filter:
      - "OFL-*.txt"
linux:
  description: A local-first language-learning companion with optional Codex integration.
  synopsis: Practice English, Portuguese, Spanish, and German with Call Nina.
  desktop:
    entry:
      Name: Call Nina
      Comment: Practise languages locally with Call Nina.
      Categories: Education;
      MimeType: x-scheme-handler/call-nina;
  target:
    - AppImage
  category: Education
  executableName: call-nina
  syncDesktopName: true
mac:
  icon: assets/call-nina.icns
  category: public.app-category.education
  minimumSystemVersion: "13.5"
  identity: "-"
  hardenedRuntime: false
  notarize: false
  signIgnore:
    - "Contents/Resources/mac-runtime/node$"
  extraResources:
    - from: ../../release/mac-runtime
      to: mac-runtime
    - from: ../../scripts/diagnostics/mac-diagnostics.mjs
      to: diagnostics/mac-diagnostics.mjs
    - from: ../../scripts/diagnostics/mac-bundle.mjs
      to: diagnostics/mac-bundle.mjs
  target: dir
win:
  icon: assets/call-nina.ico
  executableName: call-nina
  target: dir
protocols:
  - name: Call Nina activity
    schemes:
      - call-nina

dmg:
  contents:
    - x: 130
      y: 180
      type: file
    - x: 410
      y: 180
      type: link
      path: /Applications
