name: Validate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Workspace versions
        run: node scripts/commands.mjs check versions
      - name: Generated design tokens and font notices
        run: node scripts/commands.mjs check design-tokens
      - name: Formatting
        run: node scripts/commands.mjs check format
      - name: TypeScript
        run: node scripts/commands.mjs check types
      - name: ESLint
        run: node scripts/commands.mjs check lint
