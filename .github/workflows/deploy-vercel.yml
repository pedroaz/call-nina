name: Deploy Vercel
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Hosting environment
        type: choice
        options: [dev, prd]
        default: dev
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: hosting-${{ inputs.environment }}
  cancel-in-progress: false
env:
  NINA_ENVIRONMENT: ${{ inputs.environment }}
jobs:
  build:
    if: inputs.environment == 'dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    env:
      RELEASE_TARGET: hosting
      RELEASE_OPERATION: build-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Validate deployment inputs
        run: node scripts/ci/release.mjs preflight
      - name: Build combined website and API
        run: node scripts/ci/release.mjs hosting
      - id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosting
          path: build/release-artifacts/*
          if-no-files-found: error
          retention-days: 30
  database:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment == 'prd' && 'Production' || 'Preview' }}
    env:
      RELEASE_TARGET: hosting
      RELEASE_OPERATION: deploy-vercel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Build database adapter dependencies
        run: pnpm --filter @call-nina/managed-generation... run build
      - name: Download this run's verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: build/release-artifacts
      - name: Apply migrations and reconcile existing runtime grants
        run: node scripts/ci/release.mjs database
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGHOST_UNPOOLED: ${{ secrets.PGHOST_UNPOOLED }}
          PGUSER: ${{ secrets.PGUSER }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          NINA_DATABASE_RUNTIME_PASSWORD: ${{ secrets.NINA_DATABASE_RUNTIME_PASSWORD }}
  deploy:
    needs: [build, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment == 'prd' && 'Production' || 'Preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      RELEASE_TARGET: hosting
      RELEASE_OPERATION: deploy-vercel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          dependencies: "false"
      - name: Download this run's verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: build/release-artifacts
      - name: Install deployment CLI
        run: npm install --global vercel@65.5.0
      - id: deploy
        name: Verify and deploy Vercel artifact
        run: node scripts/ci/release.mjs deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Report deployment outcome
        if: always()
        run: node scripts/ci/release.mjs summary
        env:
          RELEASE_RESULTS: ${{ toJSON(steps) }}
