name: Release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build artifacts without publishing or deploying)
        type: boolean
        default: true
      dry_run_target:
        description: Dry-run target (ignored when dry run is unchecked; publishes everything)
        type: choice
        options: [all, desktop, hosting]
        default: all
      dry_run_linux:
        description: "Dry run: Linux x64"
        type: boolean
        default: true
      dry_run_windows:
        description: "Dry run: Windows x64"
        type: boolean
        default: true
      dry_run_macos_intel:
        description: "Dry run: macOS Intel"
        type: boolean
        default: true
      dry_run_macos_arm:
        description: "Dry run: macOS Apple Silicon"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.dry_run == false && 'production' || github.run_id }}
  cancel-in-progress: false
env:
  RELEASE_TARGET: ${{ inputs.dry_run == false && 'all' || inputs.dry_run_target }}
  RELEASE_OPERATION: ${{ inputs.dry_run == false && 'publish' || 'build-only' }}
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      desktop_matrix: ${{ steps.validate.outputs.desktop_matrix }}
      has_desktop: ${{ steps.validate.outputs.has_desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          dependencies: "false"
      - id: validate
        run: node scripts/ci/release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUTS: ${{ toJSON(inputs) }}
  desktop:
    needs: preflight
    if: needs.preflight.outputs.has_desktop == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Package desktop
        run: node scripts/ci/release.mjs desktop
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}
          path: build/release-artifacts/*
          if-no-files-found: error
          retention-days: 30
  hosting:
    needs: preflight
    if: inputs.dry_run == false || inputs.dry_run_target != 'desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - run: node scripts/ci/release.mjs hosting
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosting
          path: build/release-artifacts/*
          if-no-files-found: error
          retention-days: 30
  prepare:
    needs: [preflight, desktop, hosting]
    if: >-
      always() && !cancelled() && inputs.dry_run == false &&
      needs.preflight.result == 'success' && needs.desktop.result == 'success' &&
      needs.hosting.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          dependencies: "false"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: build/release-artifacts
      - run: node scripts/ci/release.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:
    needs: [preflight, desktop, hosting, prepare]
    if: >-
      always() && !cancelled() && inputs.dry_run == false &&
      needs.preflight.result == 'success' && needs.hosting.result == 'success' &&
      needs.desktop.result == 'success' && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          dependencies: "false"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hosting
          path: build/release-artifacts
      - name: Install deployment CLI
        run: npm install --global vercel@65.5.0
      - id: deploy
        run: node scripts/ci/release.mjs deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  publish:
    needs: [preflight, prepare, deploy]
    if: >-
      always() && !cancelled() && inputs.dry_run == false &&
      needs.preflight.result == 'success' && needs.prepare.result == 'success' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          dependencies: "false"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: build/release-artifacts
      - run: node scripts/ci/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
  summary:
    needs: [preflight, desktop, hosting, prepare, deploy, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: node scripts/ci/release.mjs summary
        env:
          RELEASE_RESULTS: ${{ toJSON(needs) }}
