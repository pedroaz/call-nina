name: Epic
description: Plan a product outcome with the maintainer.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Product outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Epic acceptance criteria
      description: Observable criteria for the larger outcome; link related tasks when useful.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, exclusions and linked tasks
