name: Epic
description: Plan a product outcome with the maintainer.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Product outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Epic acceptance criteria
      description: The coordinator closes the epic after all native child outcomes, required merges and these criteria are verified; account explicitly for cancelled, duplicate or not-planned children.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, exclusions and linked tasks
