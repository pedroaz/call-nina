name: Bug
description: Report a reproducible problem with Call Nina.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, app version or commit, and installation method.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Include relevant redacted diagnostic codes. Exclude learner content, credentials, private paths, and databases from text and attachments.
