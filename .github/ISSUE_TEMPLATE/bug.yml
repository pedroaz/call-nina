name: Bug
description: Record an evidenced defect for triage; filing does not approve implementation.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and affected revision
      description: Reproduction steps or precise source evidence. State what is unverified. Exclude learner data, secrets and private paths.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and acceptance blocking
      description: Who is affected? Does this block the current task or result from its changes?
    validations:
      required: true
  - type: textarea
    id: scheduling
    attributes:
      label: Deferral or independent work
      description: Why handle separately? Include likely owned files, dependencies, related issue/PR and any parent epic.
  - type: textarea
    id: acceptance
    attributes:
      label: Fix acceptance criteria
      description: Describe observable corrected behavior; no automated application tests or saved journeys.
